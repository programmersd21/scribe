[package]
# the crates.io name "scribe" was taken years ago. the command is still
# `scribe`; only the package name had to get creative.
name = "scribe-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
description = "local, offline, cpu-only speech to text in the terminal"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/programmersd21/scribe"
keywords = ["whisper", "transcription", "tui", "ratatui", "speech"]
categories = ["command-line-utilities", "multimedia::audio"]
include = [
    "src/**/*",
    "assets/**/*",
    "readme.md",
    "rust-toolchain.toml",
    "LICENSE",
    ".github/workflows/ci.yml",
]

[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
# terminal ui. ratatui 0.30.2 uses crossterm 0.29, pinned identically below so
# event types and terminal state are shared, never two incompatible versions.
ratatui = "0.30.2"
# raw terminal events and alternate screen, same version ratatui re-exports.
crossterm = "0.29.0"
# whisper.cpp bindings. default features off means cpu only: no cuda, metal,
# vulkan, hipblas, coreml or sycl backends are compiled.
whisper-rs = { version = "0.16.0", default-features = false }
# small blocking http client for model downloads (model manager stays sync).
ureq = "3.5.2"
# display width for word wrap and truncation, already in the ratatui tree.
unicode-width = "0.2.3"
# yt-dlp wrapper: auto-installs its binaries and fetches metadata/audio. only
# the url fetch path is async; it runs on a current-thread runtime inside the
# worker thread, so the tui event loop remains synchronous.
yt-dlp = { version = "2.10.0", default-features = false, features = ["cache-json", "rustls"] }
# minimal tokio for the current-thread runtime used by the yt-dlp wrapper.
tokio = { version = "1.54.1", features = ["rt", "fs", "process", "time", "sync"] }
# sha256 verification of downloaded model files against the upstream table.
sha2 = "0.11.2"
# locate ffprobe on path; used by the duration detector in worker.rs.
which = "8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
